[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/agent-run"
  to = "/.netlify/functions/agent-run"
  status = 200

[[redirects]]
  from = "/api/deep-research"
  to = "/.netlify/functions/deep-research"
  status = 200

[[redirects]]
  from = "/api/web-reader"
  to = "/.netlify/functions/web-reader"
  status = 200

[[redirects]]
  from = "/api/live-signals"
  to = "/.netlify/functions/live-signals"
  status = 200

[[redirects]]
  from = "/api/cached-signals"
  to = "/.netlify/functions/cached-signals"
  status = 200

[[redirects]]
  from = "/api/refresh-signals"
  to = "/.netlify/functions/refresh-signals"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
